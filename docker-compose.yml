services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: educational_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educational_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  fastapi:
    build:
      context: .
      dockerfile: backend_fastapi/Dockerfile
    container_name: fastapi-app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8005
      WORKERS: 2
      AI_SERVICE_URL: http://ai-service:8001
      ENVIRONMENT: docker
      PYTHONPATH: /app
      APP_DATA_DIR: /app/data
      APP_UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/educational_platform
    ports:
      - '8005:8005'
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - app-network
    volumes:
      - ./backend_fastapi:/app:delegated
      - ./database:/app/database:ro
      - ./data:/app/data
      - ./backend_fastapi/uploads:/app/uploads
      - ./backend_fastapi/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  ai-service:
    build:
      context: ./ai-model
      dockerfile: Dockerfile
    container_name: ai-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - '8001:8001'
    networks:
      - app-network
    volumes:
      - ./ai-model:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge